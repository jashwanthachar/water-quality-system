<!DOCTYPE html>
<html lang="en">
<head>

  <title>Ward Water Hotspot Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

</head>
<body>
  <div class="app-container" style="max-width: 600px;">
    <header class="page-header">
      <a href="index.html" class="back-btn">←</a>
      <h1>🗺️ Ward Water Hotspot Map</h1>

    <main class="main-content">
      <div id="map"></div>
      <p class="legend">
        🟢 Normal &nbsp; 🟡 Attention &nbsp; 🔴 High Priority
        <br><small>Based on complaints in the last 30 days and the latest water test record.</small>
      </p>

      <div class="card">

        <div id="summary">Loading...</div>
      </div>
      <a class="btn btn-outline" href="index.html">← Back to Home</a>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-link">
        <span class="nav-icon">🏠</span>

      </a>
      <a href="water.html" class="nav-link">
        <span class="nav-icon">💧</span>

      </a>
      <a href="qr.html" class="nav-link">
        <span class="nav-icon">📱</span>
        <span>Ward QR</span>
      </a>
      <a href="my-complaints.html" class="nav-link">
        <span class="nav-icon">📝</span>
        <span>Complaints</span>
      </a>
      <a href="map.html" class="nav-link active">
        <span class="nav-icon">📍</span>
        <span>Map</span>
      </a>
    </nav>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/map.js"></script>
</body>
</html>
