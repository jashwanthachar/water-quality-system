<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scan Ward QR Code</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    #reader {
      width: 100%;
      max-width: 360px;
      margin: 12px auto;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #000;
      min-height: 240px;
    }
    #reader video {
      border-radius: var(--radius-md);
      width: 100% !important;
      height: auto !important;
    }
    .scan-status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="page-header">
      <a href="index.html" class="back-btn">←</a>
      <h1>📷 Scan Ward QR Code</h1>
    </header>

    <main class="main-content">
      <div class="card" style="text-align: center;">
        <p style="font-size: 13.5px; color: #64748b; margin-bottom: 8px;">Point your camera at a ward water information QR code.</p>

        <div id="reader"></div>
        <div id="scanStatus" class="scan-status" style="display:none;"></div>

        <div style="margin-top: 14px;">
          <p><small>Or select a photo containing a QR code:</small></p>
          <input type="file" id="qrFileInput" accept="image/*" style="display:none;" />
          <button type="button" class="btn btn-outline" onclick="document.getElementById('qrFileInput').click()">
            📁 Upload QR Image from Gallery
          </button>
        </div>
      </div>

      <a class="btn btn-outline" href="index.html">← Back to Home</a>
    </main>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-link">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="water.html" class="nav-link">
        <span class="nav-icon">💧</span>
        <span>Water Quality</span>
      </a>
      <a href="scan.html" class="nav-link active">
        <span class="nav-icon">📷</span>
        <span>Scan QR</span>
      </a>
      <a href="my-complaints.html" class="nav-link">
        <span class="nav-icon">📝</span>
        <span>Complaints</span>
      </a>
      <a href="map.html" class="nav-link">
        <span class="nav-icon">📍</span>
        <span>Map</span>
      </a>
    </nav>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    const statusBox = document.getElementById("scanStatus");

    function setStatus(msg, isSuccess = false) {
      statusBox.style.display = "block";
      statusBox.textContent = msg;
      statusBox.style.background = isSuccess ? "#d8f3dc" : "#fff3bf";
      statusBox.style.color = isSuccess ? "#1b4332" : "#856404";
    }

    function handleDecodedText(decodedText) {
      setStatus("✅ QR Code Detected! Redirecting...", true);
      
      try {
        if (scanner) {
          scanner.stop().catch(console.error);
        }
      } catch (e) {}

      const wardMatch = decodedText.match(/[?&]ward=(\d+)/i) || decodedText.match(/^(\d+)$/);
      if (wardMatch) {
        const wardId = wardMatch[1];
        window.location.href = `water.html?ward=${wardId}`;
        return;
      }

      if (decodedText.includes("water.html")) {
        window.location.href = decodedText;
        return;
      }

      if (decodedText.startsWith("http://") || decodedText.startsWith("https://")) {
        window.location.href = decodedText;
        return;
      }

      setStatus(`Scanned: ${decodedText}. (Not a recognized ward QR code)`);
    }

    let scanner = null;
    function startCamera() {
      scanner = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 220, height: 220 } };

      scanner.start(
        { facingMode: "environment" },
        config,
        (decodedText) => handleDecodedText(decodedText),
        (errorMessage) => {}
      ).catch(err => {
        console.warn("Camera start failed:", err);
        document.getElementById("reader").innerHTML = `
          <div style="padding:20px; color:#c1121f; background:#fff;">
            <p>📷 Camera could not be opened automatically.</p>
            <p><small>${err?.message || "Please grant camera permissions in your mobile browser, or use the photo upload below."}</small></p>
          </div>`;
      });
    }

    document.getElementById("qrFileInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const fileScanner = new Html5Qrcode("reader");
      try {
        setStatus("Reading image file...");
        const result = await fileScanner.scanFile(file, true);
        handleDecodedText(result);
      } catch (err) {
        setStatus("❌ Could not find a valid QR code in that image.");
      }
    });

    window.addEventListener("DOMContentLoaded", startCamera);
  </script>
</body>
</html>
